name: Publish to MCP Registry

# Publishes server.json to the official MCP Registry as io.github.library-x/tuney.
# Uses GitHub Actions OIDC, which carries the repository owner (library-x), so no secret is needed.
# Runs when server.json changes on main, or by hand from the Actions tab.

on:
  push:
    branches: [main]
    paths:
      - server.json
      - .github/workflows/publish-registry.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --version

      - name: Validate server.json
        run: ./mcp-publisher validate server.json

      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish

      - name: Show the listing
        run: |
          sleep 5
          curl -s "https://registry.modelcontextprotocol.io/v0.1/servers?search=io.github.library-x/tuney"
